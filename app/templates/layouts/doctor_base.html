<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>

        {% block title %}

        SkinAI Clinical

        {% endblock %}

    </title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet"
          href="{{ url_for('static',filename='css/style.css') }}">

    <link rel="stylesheet"
          href="{{ url_for('static',filename='css/common.css') }}">

    <link rel="stylesheet"
          href="{{ url_for('static',filename='css/doctor.css') }}">

    <link rel="stylesheet"
          href="{{ url_for('static',filename='css/doctor_header.css') }}">

    <link rel="stylesheet"
          href="{{ url_for('static',filename='css/doctor_sidebar.css') }}">

</head>

<body>

<div class="sidebar-overlay" id="sidebarOverlay"></div>

{% include "doctor/sidebar.html" %}

<div class="main-content">

    {% include "doctor/navbar.html" %}

    <main class="page-content">

        {% block content %}

        {% endblock %}

    </main>

    {% include "doctor/footer.html" %}

    {% include "layouts/bottom_nav.html" %}

</div>

<script src="{{ url_for('static',filename='js/doctor.js') }}"></script>

</body>

</html>
