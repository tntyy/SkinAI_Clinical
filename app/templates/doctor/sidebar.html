<!-- ==========================================================
     SIDEBAR OVERLAY (chỉ hiện trên mobile khi sidebar mở)
=========================================================== -->
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<aside class="sidebar" id="sidebar">

    <button class="sidebar-close" id="sidebarClose" aria-label="Đóng menu">
        <i class="bi bi-x-lg"></i>
    </button>

    <div class="sidebar-logo">
        <img src="{{ url_for('static', filename='images/logo.png') }}" alt="SkinAI Clinical">
    </div>

    <nav class="sidebar-menu">

        <ul class="menu">

            <li class="{{ 'active' if request.endpoint == 'doctor.dashboard' }}">
                <a href="{{ url_for('doctor.dashboard') }}">
                    <i class="bi bi-grid-1x2-fill"></i>
                    <span>Dashboard</span>
                </a>
            </li>

            <li class="{{ 'active' if request.endpoint and request.endpoint.startswith('patient.') }}">
                <a href="{{ url_for('patient.list_patients') }}">
                    <i class="bi bi-people-fill"></i>
                    <span>Bệnh nhân</span>
                </a>
            </li>

            <li class="{{ 'active' if request.endpoint == 'doctor.icd10' }}">
                <a href="{{ url_for('doctor.icd10') }}">
                    <i class="bi bi-clipboard2-pulse-fill"></i>
                    <span>Tra cứu ICD-10</span>
                </a>
            </li>

            <li class="{{ 'active' if request.endpoint == 'doctor.reports' }}">
                <a href="{{ url_for('doctor.reports') }}">
                    <i class="bi bi-bar-chart-fill"></i>
                    <span>Báo cáo</span>
                </a>
            </li>

            <li class="{{ 'active' if request.endpoint == 'doctor.settings' }}">
                <a href="{{ url_for('doctor.settings') }}">
                    <i class="bi bi-gear-fill"></i>
                    <span>Cài đặt</span>
                </a>
            </li>

        </ul>

        <ul class="menu menu-bottom">
            <li class="logout">
                <a href="{{ url_for('auth.logout') }}">
                    <i class="bi bi-box-arrow-right"></i>
                    <span>Đăng xuất</span>
                </a>
            </li>
        </ul>

    </nav>

</aside>

<script>
/* ==========================================================
   TOGGLE SIDEBAR (mobile)
   - #sidebarToggle nằm trong navbar.html, được include SAU
     sidebar.html trong doctor_base.html, nên phải chờ
     DOMContentLoaded để chắc chắn phần tử đã tồn tại.
=========================================================== */
document.addEventListener('DOMContentLoaded', function () {

    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebarOverlay');
    const openBtn = document.getElementById('sidebarToggle');
    const closeBtn = document.getElementById('sidebarClose');

    function openSidebar() {
        sidebar.classList.add('active');
        overlay.classList.add('active');
        document.body.style.overflow = 'hidden';
    }

    function closeSidebar() {
        sidebar.classList.remove('active');
        overlay.classList.remove('active');
        document.body.style.overflow = '';
    }

    if (openBtn) openBtn.addEventListener('click', openSidebar);
    if (closeBtn) closeBtn.addEventListener('click', closeSidebar);
    if (overlay) overlay.addEventListener('click', closeSidebar);

    // Đóng sidebar khi resize sang desktop
    window.addEventListener('resize', function () {
        if (window.innerWidth > 992) closeSidebar();
    });
});
</script>
